name: PostPilot CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zero TypeScript Rule
        run: |
          TS_COUNT=$(find . -not -path "*/node_modules/*" \( -name "*.ts" -o -name "*.tsx" -o -name "tsconfig.json" \) | wc -l)
          if [ "$TS_COUNT" -gt 0 ]; then
            echo "❌ Strict Rule Violation: TypeScript files detected ($TS_COUNT files found)."
            exit 1
          fi
          echo "✅ Strict JavaScript Rule Verified: 0 TypeScript files."

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Test Suite
        run: npm run test
